<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LibreCorsa - Offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #08090D;
      color: #F5F7FA;
      display: grid;
      place-items: center;
    }
    main {
      max-width: 440px;
      padding: 32px;
      border: 1px solid #2C3246;
      border-radius: 12px;
      background: #10131C;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 0 24px;
      color: #A6B0C3;
      line-height: 1.5;
      font-size: 14px;
    }
    a.retry {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 8px;
      background: #CCFF00;
      color: #08090D;
      font-weight: 700;
      text-decoration: none;
    }
    a.retry:hover {
      background: #E2FF4D;
    }
  </style>
</head>
<body>
  <main>
    <h1>Could not reach LibreCorsa</h1>
    <p>Check your internet connection and try loading https://librecorsa.org/play again.</p>
    <a class="retry" href="https://librecorsa.org/play">Retry</a>
  </main>
</body>
</html>
